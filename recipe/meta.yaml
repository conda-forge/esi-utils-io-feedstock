{% set name = "esi-utils-io" %}
{% set version = "1.1.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 2fffa8ac1650670a20d4fff7488833585b20e779e0b2d8457e6e7726fd13ad16

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - h5py >=3.1.0
    - numpy >=1.21
    - pandas >=1.0
    - pytz >=2021.3

test:
  imports:
    - esi_utils_io
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://pypi.org/project/esi-utils-io/
  summary: USGS Earthquake Impact Utilities for IO
  license: Unlicense
  license_file: LICENSE.md

extra:
  recipe-maintainers:
    - ocefpaf
